<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient matching GitHub Dark Mode -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Glowing Accent Gradient (Cyan to Purple to Green) -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#39d353" />
    </linearGradient>

    <!-- Wave Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="250" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="2" />

  <!-- Abstract Waves -->
  <path d="M0,175 Q250,225 500,162 T1000,187 L1000,250 L0,250 Z" fill="url(#accent)" opacity="0.15" />
  <path d="M0,200 Q300,140 600,210 T1000,160 L1000,250 L0,250 Z" fill="url(#accent)" opacity="0.25" filter="url(#glow)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1000" height="4" fill="url(#accent)" />

  <!-- Main Text -->
  <text x="50" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#f0f6fc">
    Hi, I'm <tspan fill="#58a6ff">Ravindu De mel</tspan> 👋
  </text>

  <!-- Subtitle -->
  <text x="50" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8b949e">
    Computer Engineering Undergrad | AI &amp; Edge Computing | Software Development
  </text>

  <!-- Badges / Tags (Based on your CV) -->
  <g transform="translate(50, 170)">
    <!-- Badge 1: Degree -->
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#21262d" stroke="#30363d" />
    <text x="70" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#58a6ff">B.Sc. Comp. Eng.</text>

    <!-- Badge 2: Interest -->
    <rect x="155" y="0" width="130" height="32" rx="8" fill="#21262d" stroke="#30363d" />
    <text x="220" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#bc8cff">AI &amp; Edge</text>

    <!-- Badge 3: Skill -->
    <rect x="300" y="0" width="140" height="32" rx="8" fill="#21262d" stroke="#30363d" />
    <text x="370" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#39d353">Software Dev</text>

    <!-- Badge 4: Design Skill from CV -->
    <rect x="455" y="0" width="140" height="32" rx="8" fill="#21262d" stroke="#30363d" />
    <text x="525" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f2e054">Visual Design</text>
  </g>
</svg>
